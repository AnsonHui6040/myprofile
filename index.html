<script type="text/babel">
// Static identity remains visible until playback starts, and on unsupported browsers.
function AnimatedSignature() {
  const video = React.useRef(null);
  const stage = React.useRef(null);
  const inView = React.useRef(true);
  const alphaVerified = React.useRef(false);
  const [appleAlpha, setAppleAlpha] = React.useState(false);
  const [enabled, setEnabled] = React.useState(false);
  const [playing, setPlaying] = React.useState(false);
  const [failed, setFailed] = React.useState(false);
  React.useEffect(() => {
    // Apple WebKit can decode VP9 while dropping its alpha plane. Route Apple
    // browsers to HEVC with alpha rather than relying on canPlayType alone.
    setAppleAlpha(navigator.vendor === 'Apple Computer, Inc.' ||
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
    const media = window.matchMedia('(prefers-reduced-motion: reduce)');
    const sync = () => {
      const allowed = !media.matches && !navigator.connection?.saveData;
      setEnabled(allowed);
      if (!allowed) { video.current?.pause(); setPlaying(false); }
    };
    sync(); media.addEventListener('change', sync);
    return () => media.removeEventListener('change', sync);
  }, []);
  // Never leave a hidden or suspended video as the only visible logo layer.
  React.useEffect(() => {
    const restoreStatic = () => {
      video.current?.pause();
      setPlaying(false);
    };
    const observer = new IntersectionObserver(([entry]) => {
      inView.current = entry.isIntersecting;
      if (!entry.isIntersecting) restoreStatic();
    });
    observer.observe(stage.current);
    const onVisibility = () => { if (document.hidden) restoreStatic(); };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pageshow', restoreStatic);
    return () => {
      observer.disconnect();
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('pageshow', restoreStatic);
    };
  }, []);
  const onPlaying = () => {
    if (!inView.current || document.hidden) {
      video.current?.pause();
      setPlaying(false);
      return;
    }
    // This asset's corner is transparent in every frame. Check the decoded
    // frame before revealing the video so an opaque decoder never shows a box.
    if (!alphaVerified.current) {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = 1;
        const context = canvas.getContext('2d', { willReadFrequently: true });
        if (!context) throw new Error('Canvas unavailable');
        context.drawImage(video.current, 0, 0, 1, 1, 0, 0, 1, 1);
        if (context.getImageData(0, 0, 1, 1).data[3] !== 0) throw new Error('Opaque video decoder');
        alphaVerified.current = true;
      } catch {
        video.current?.pause();
        setPlaying(false);
        setFailed(true);
        return;
      }
    }
    setPlaying(true);
  };
  const replay = () => {
    if (!video.current) return;
    video.current.currentTime = 0;
    video.current.play().catch((error) => {
      // Scrolling away can intentionally cancel a pending play request.
      // Leave newer playback state intact when that older request is aborted.
      if (error.name === 'AbortError') return;
      setPlaying(false);
      if (error.name === 'NotSupportedError') setFailed(true);
    });
  };
  return <div className="signature-block">
    <button ref={stage} type="button" className={`signature-stage ${playing ? 'is-playing' : ''}`} onClick={replay} disabled={!enabled || failed} aria-label="重播 Logo 動畫" title={enabled && !failed ? '點按 Logo 重新播放' : undefined}>
      <BrandLogo full />
      {enabled && !failed && <video ref={video} autoPlay muted playsInline preload="none" aria-hidden="true" onPlaying={onPlaying} onWaiting={() => setPlaying(false)} onStalled={() => setPlaying(false)} onPause={() => setPlaying(false)} onEnded={() => setPlaying(false)} onError={() => { setPlaying(false); setFailed(true); }}>
        <source src={appleAlpha ? 'assets/brand/anson-reveal-hevc.mov' : 'assets/brand/anson-reveal.webm'} type={appleAlpha ? 'video/quicktime; codecs="hvc1"' : 'video/webm; codecs="vp9"'} onError={() => { setPlaying(false); setFailed(true); }} />
      </video>}
    </button>
  </div>;
}

const HERO_ROLES = ['Photo Club\nLeader.', 'Image\nStoryteller.', 'Memory\nCollector.', 'Travel\nEnthusiast.'];

function RotatingRoles() {
  const [motion, setMotion] = React.useState(false);
  React.useEffect(() => {
    const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
    const sync = () => setMotion(!preference.matches);
    sync();
    preference.addEventListener('change', sync);
    return () => preference.removeEventListener('change', sync);
  }, []);
  const typed = useTyper(HERO_ROLES, {
    typeMs: 65, eraseMs: 30, holdMs: 1800, enabled: motion,
  });
  return <div className="hero-roles">
    <p className="sr-only">I’m a photo club leader, image storyteller, memory collector and travel enthusiast.</p>
    <span className="hero-role-prefix" aria-hidden="true"><img src="assets/brand/im-monogram.svg" alt="" width="96" height="108" /></span>
    <div className="hero-role-cycle" aria-hidden="true">
      {HERO_ROLES.map(role => <span className="hero-role-measure" key={role}>{role}</span>)}
      <p className="hero-role-text">{motion ? typed : HERO_ROLES[0]}{motion && <Caret color="var(--accent)" width={2} height=".85em" />}</p>
    </div>
  </div>;
}

function HomePage() {

            <div className="hero-actions"><a className="button-primary" href="photography.html">探索攝影作品 <span aria-hidden="true">↗</span></a><a className="button-text" href="projects.html">數位專案 <span aria-hidden="true">→</span></a></div>
          </div>
        </div>
        <figure className="hero-portrait">
          <div className="portrait-image"><img src="photo/p10.jpeg" alt="Anson 站在河口湖畔，眺望白雪覆蓋的富士山" width="1200" height="900" fetchPriority="high" /><div className="portrait-topline"><span>FIELD NOTES / 2025</span><span>山梨，日本</span></div><div className="portrait-caption"><span className="eyebrow">A MOMENT, KEPT.</span><span>Somewhere between<br /><em>here & the next idea.</em></span></div></div>
          <figcaption><span>MOUNT FUJI · YAMANASHI</span><span>NIKON Z6II / 70–200MM</span></figcaption>
        </figure>
      </section>
      <div className="identity-strip"><span>PHOTOGRAPHER <b>／</b> DEVELOPER <b>／</b> EXPLORER</span><a href="#selected-work">SCROLL TO EXPLORE <span aria-hidden="true">↓</span></a></div>
      <section id="selected-work" className="home-section selected-work" aria-labelledby="selected-title">
        <div className="section-heading"><div><span className="eyebrow">THROUGH MY LENS / 攝影</span><h2 id="selected-title">Moments worth <em>keeping.</em></h2></div><a className="text-link" href="photography.html">全部攝影作品 <span aria-hidden="true">↗</span></a></div>
        <div className="selected-grid">
          {[{src:'photo/p1.jpeg', width:2048, height:1362, title:'壓縮的紅光', en:'COMPRESSED RED LIGHT'}, {src:'photo/p6.jpeg', width:1363, height:2048, title:'星月夜', en:'STARRY MOONLIT NIGHT'}, {src:'photo/p3.jpeg', width:2048, height:1362, title:'東海狂想曲', en:'TUNGHAI RHAPSODY'}].map((p,i) => <a className="selected-photo" href="photography.html" key={p.src}><div className="photo-window"><img src={p.src} alt={p.title} loading="lazy" width={p.width} height={p.height} /><span className="photo-open" aria-hidden="true">↗</span></div><div className="photo-label"><span>{p.title}</span><span>{p.en}</span></div></a>)}
        </div>
      </section>
      <section className="home-section about-section" aria-labelledby="about-title">
        <div className="about-copy"><span className="eyebrow">BEHIND THE FRAME / 關於我</span><h2 id="about-title">喜歡在事物裡，<br />留下一點<span>痕跡。</span></h2><p><span>可能是一個網站，</span><span>可能是一張照片，</span><span>可能是某個沒人會特別注意、</span><span>但少了會覺得哪裡不對的細節。</span></p><p><span>現在在臺灣，</span><span>在攝影和程式之間來回，</span><span>還不確定終點在哪裡，</span><span>但不太著急。</span></p><a className="text-link" href="awards.html">獎項與創作歷程 <span aria-hidden="true">↗</span></a></div>
        <div className="journey"><span className="eyebrow">ALONG THE WAY / 歷程</span>{CV.map(row => <div className="journey-row" key={row.year}><span className="journey-year">{row.year}</span><div className="journey-description"><h3>{row.role}</h3><p>{row.note}</p></div>{row.milestone && <span className="journey-milestone">{row.milestone}</span>}</div>)}</div>
      </section>
      <section className="home-section projects-section" aria-labelledby="projects-title">
        <div className="section-heading"><div><span className="eyebrow">BEYOND THE FRAME / 數位創作</span><h2 id="projects-title">Ideas made <em>real.</em></h2></div><a className="text-link" href="projects.html">全部專案 <span aria-hidden="true">↗</span></a></div>
        <div className="home-projects">{PROJECTS.map((p,i) => <a className="home-project" key={p.name} href={p.url}><span className="project-type">{i === 0 ? 'TASTE & DISCOVERY' : 'PLACES & POSSIBILITIES'}<span>WEB / {p.year}</span></span><h3>{p.name}</h3><p>{p.desc}</p><span className="project-bottom">VIEW ON GITHUB <span aria-hidden="true">↗</span></span></a>)}</div>
      </section>
    </main>
    <PageFooter />
  </div>;
}

</script>
